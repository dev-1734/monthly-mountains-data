name: Dispatch migration verification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dispatch-migration-verification.yml"

jobs:
  dispatch:
    runs-on: [self-hosted, macOS, ARM64, dev-mac]
    timeout-minutes: 10
    steps:
      - name: Dispatch verification workflows
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN
          gh auth status -h github.com

          gh workflow run forecast-weather.yml --repo dev-1734/monthly-mountains-data
          gh workflow run build-mountains.yml --repo dev-1734/monthly-mountains-data -f limit=10
          gh workflow run train-crowd.yml --repo dev-1734/monthly-mountains-data

          gh workflow run daily-signals.yml --repo dev-1734/monthly-mountains-signals
          gh workflow run probe-restaurants.yml --repo dev-1734/monthly-mountains-signals -f mountain=bukhansan -f official=true
          gh workflow run weekly-batch.yml --repo dev-1734/monthly-mountains-signals -f quarter=0

          gh workflow run local-mac-ci.yml --repo dev-1734/real-rich-android

          echo "Dispatched remaining migration verification workflows."
