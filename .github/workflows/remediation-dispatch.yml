name: remediation-dispatch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remediation-dispatch.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch final train-crowd verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run train-crowd.yml --repo "${{ github.repository }}"
          echo "dispatched train-crowd"
