name: remediation-dispatch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remediation-dispatch.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch repaired workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          gh workflow run forecast-weather.yml --repo "$repo"
          gh workflow run build-mountains.yml --repo "$repo"
          gh workflow run train-crowd.yml --repo "$repo"
          echo "dispatched forecast-weather, build-mountains, train-crowd"
