name: diag-data-go

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diag-data-go.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: DNS and route
        shell: bash
        run: |
          set +e
          echo '=== getent ==='
          getent ahosts www.data.go.kr
          echo '=== resolv.conf ==='
          cat /etc/resolv.conf

      - name: Curl detail page
        shell: bash
        run: |
          set +e
          echo '=== default ==='
          curl -v -L --connect-timeout 15 --max-time 30 -o /tmp/detail.html -w '\nHTTP=%{http_code} remote=%{remote_ip} connect=%{time_connect} tls=%{time_appconnect} total=%{time_total}\n' \
            -A 'Mozilla/5.0 (monthly-mountains data pipeline)' \
            'https://www.data.go.kr/data/15107577/fileData.do'
          echo '=== ipv4 ==='
          curl -4 -v -L --connect-timeout 15 --max-time 30 -o /tmp/detail4.html -w '\nHTTP=%{http_code} remote=%{remote_ip} connect=%{time_connect} tls=%{time_appconnect} total=%{time_total}\n' \
            -A 'Mozilla/5.0 (monthly-mountains data pipeline)' \
            'https://www.data.go.kr/data/15107577/fileData.do'
          echo '=== page bytes ==='
          wc -c /tmp/detail.html /tmp/detail4.html 2>/dev/null
          grep -o 'FILE_[A-Za-z0-9_]*' /tmp/detail4.html 2>/dev/null | head || true

      - name: Curl fallback download
        shell: bash
        run: |
          set +e
          curl -4 -v -L --connect-timeout 15 --max-time 60 -o /tmp/visitors.bin -w '\nHTTP=%{http_code} type=%{content_type} remote=%{remote_ip} size=%{size_download} connect=%{time_connect} tls=%{time_appconnect} total=%{time_total}\n' \
            -A 'Mozilla/5.0 (monthly-mountains data pipeline)' \
            'https://www.data.go.kr/cmm/cmm/fileDownload.do?atchFileId=FILE_000000003643932&fileDetailSn=1&insertDataPrcus=N'
          file /tmp/visitors.bin 2>/dev/null || true
          wc -c /tmp/visitors.bin 2>/dev/null || true
          head -c 120 /tmp/visitors.bin 2>/dev/null | strings || true

      - name: Python requests comparison
        shell: bash
        run: |
          python3 - <<'PY'
          import requests, socket
          urls = [
              'https://www.data.go.kr/data/15107577/fileData.do',
              'https://www.data.go.kr/cmm/cmm/fileDownload.do?atchFileId=FILE_000000003643932&fileDetailSn=1&insertDataPrcus=N',
          ]
          print('addrinfo:', socket.getaddrinfo('www.data.go.kr', 443, proto=socket.IPPROTO_TCP))
          for u in urls:
              try:
                  r = requests.get(u, headers={'User-Agent':'Mozilla/5.0 (monthly-mountains data pipeline)'}, timeout=(15,30), allow_redirects=True)
                  print(u, '->', r.status_code, r.url, r.headers.get('content-type'), len(r.content))
              except Exception as e:
                  print(u, '->', type(e).__name__, repr(e))
          PY
