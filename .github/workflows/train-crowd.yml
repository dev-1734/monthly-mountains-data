name: train-crowd

# 혼잡도 모델 학습. 특별한 플랫폼 요구가 없으므로 공통 1402mac self-hosted runner에서 실행한다.
# 입력은 (a) 국립공원공단 실측 탐방객 통계와 (b) signals 레포가 push 한 정규화 지수다.

on:
  schedule:
    - cron: "45 5 * * 0"
      timezone: "Asia/Seoul"
  workflow_dispatch:
  repository_dispatch:
    types: [signals-updated]

permissions:
  contents: write

concurrency:
  group: train-crowd
  cancel-in-progress: true

jobs:
  train:
    runs-on: [self-hosted, macOS, ARM64, dev-mac]
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare runner-local Python
        shell: bash
        run: |
          set -euo pipefail
          command -v python3
          python3 --version
          venv="$RUNNER_TEMP/mountains-data-train-venv"
          rm -rf "$venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install --upgrade pip
          "$venv/bin/python" -m pip install -r requirements.txt
          echo "$venv/bin" >> "$GITHUB_PATH"

      - name: 국립공원 실측 탐방객 통계 내려받기
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python pipeline/fetch_visitor_stats.py

      - name: 학습 및 검증
        run: python pipeline/train_crowd.py --max-mape 0.45

      - name: 변경분 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/v1/crowd_model.json data/v1/manifest.json
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "crowd: 모델 재학습"
          git push
