name: train-crowd

# 혼잡도 모델 학습.
# public repo에서 self-hosted runner를 쓰면 fork PR이 로컬 Mac에서 코드를 실행할 수 있어
# 보안상 이 워크플로는 GitHub-hosted runner를 유지한다.

on:
  schedule:
    - cron: "45 5 * * 0"
      timezone: "Asia/Seoul"
  workflow_dispatch:
  repository_dispatch:
    types: [signals-updated]

permissions:
  contents: write

concurrency:
  group: train-crowd
  cancel-in-progress: true

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 국립공원 실측 탐방객 통계 내려받기
        id: visitors
        run: |
          set -euo pipefail
          # www.data.go.kr 파일 서버가 간헐적으로 ConnectTimeout을 내므로
          # 전체 다운로드를 새 연결로 최대 3회 다시 시도한다.
          for attempt in 1 2 3; do
            echo "탐방객 통계 다운로드 시도 $attempt/3"
            set +e
            python pipeline/fetch_visitor_stats.py
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              echo "fresh=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done

          # 원천 파일 서버가 장시간 장애여도 마지막으로 검증된 모델은 계속 서비스한다.
          # 신규 데이터가 없으므로 이 회차의 재학습만 생략하고 현재 모델을 검증한다.
          echo "fresh=false" >> "$GITHUB_OUTPUT"
          echo "::warning::www.data.go.kr 연결 실패 — 신규 탐방객 통계를 받지 못해 이번 재학습을 생략합니다."
          echo "### train-crowd: 신규 학습 생략" >> "$GITHUB_STEP_SUMMARY"
          echo "www.data.go.kr 연결 실패로 기존 검증 모델을 유지합니다. 다음 정기 실행에서 다시 시도합니다." >> "$GITHUB_STEP_SUMMARY"

      - name: 학습 및 검증
        if: steps.visitors.outputs.fresh == 'true'
        run: python pipeline/train_crowd.py --max-mape 0.45

      - name: 기존 모델 안전성 검증
        if: steps.visitors.outputs.fresh != 'true'
        run: python pipeline/validate.py data/v1/crowd_model.json

      - name: 변경분 커밋
        if: steps.visitors.outputs.fresh == 'true'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/v1/crowd_model.json data/v1/manifest.json
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "crowd: 모델 재학습"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          echo "동시 push 충돌이 3회 반복되어 중단합니다."
          exit 1
