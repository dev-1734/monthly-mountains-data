name: forecast-weather

# 3시간마다 산별 날씨·대기질·특보를 받아 forecast/<id>.json 으로 배포한다.
# 기상청 발표가 하루 8회(02·05·08·11·14·17·20·23시)라 그보다 자주 받을 이유가 없다.
# public repo에서 self-hosted runner를 쓰면 fork PR이 로컬 Mac에서 코드를 실행할 수 있어
# 보안상 이 워크플로는 GitHub-hosted runner를 유지한다.

on:
  schedule:
    - cron: "20 */3 * * *"
      timezone: "Asia/Seoul"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forecast-weather
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 날씨·대기질·특보 수집
        id: collect
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          set +e
          python pipeline/collect_weather.py
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          [ "$rc" = "0" ] || [ "$rc" = "3" ] || exit "$rc"

      - name: 변경분 커밋
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 수집 결과를 보관한 뒤 매 시도마다 최신 main 위에 다시 적용한다.
          # 다른 workflow가 manifest.json을 먼저 갱신해도 rebase conflict가 나지 않는다.
          tmp="$(mktemp -d)"
          cp -R data/v1/forecast "$tmp/forecast"
          python - <<'PY' > "$tmp/forecast-manifest.json"
          import json
          from pathlib import Path
          m = json.loads(Path('data/v1/manifest.json').read_text())
          keep = {k: m[k] for k in ('forecast_count', 'forecastUpdatedAt') if k in m}
          print(json.dumps(keep, ensure_ascii=False))
          PY

          for attempt in 1 2 3 4; do
            echo "push 시도 $attempt/4"
            git fetch origin main
            git reset --hard origin/main
            rm -rf data/v1/forecast
            cp -R "$tmp/forecast" data/v1/forecast
            PATCH_FILE="$tmp/forecast-manifest.json" python - <<'PY'
          import json
          import os
          from pathlib import Path
          latest = Path('data/v1/manifest.json')
          patch = Path(os.environ['PATCH_FILE'])
          m = json.loads(latest.read_text()) if latest.exists() else {'schemaVersion': 1}
          m.update(json.loads(patch.read_text()))
          latest.write_text(json.dumps(m, ensure_ascii=False, indent=2) + '\n')
          PY
            git add data/v1/forecast data/v1/manifest.json
            if git diff --cached --quiet; then
              echo "변경 없음"
              exit 0
            fi
            git commit -m "forecast: $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "동시 push 감지 — 최신 main 위에 다시 적용합니다."
            sleep $((attempt * 2))
          done
          echo "4회 재시도 후에도 push 실패"
          exit 1

      - name: 중단된 회차는 빨간불로 남긴다
        if: steps.collect.outputs.rc == '3'
        run: |
          echo "포털 장애 또는 시간 초과로 이번 회차를 중간에 끊었습니다 — 받은 만큼은 커밋했습니다."
          echo "3시간 뒤 회차가 이어받습니다. 계속 빨간불이면 공공데이터포털 상태를 확인하세요."
          exit 1
