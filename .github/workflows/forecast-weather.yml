name: forecast-weather

# 3시간마다 산별 날씨·대기질·특보를 받아 forecast/<id>.json 으로 배포한다.
# 기상청 발표가 하루 8회(02·05·08·11·14·17·20·23시)라 그보다 자주 받을 이유가 없다.
# 특별한 플랫폼 요구가 없으므로 공통 1402mac self-hosted runner에서 실행한다.

on:
  schedule:
    - cron: "20 */3 * * *"
      timezone: "Asia/Seoul"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forecast-weather
  cancel-in-progress: true

jobs:
  collect:
    runs-on: [self-hosted, macOS, ARM64, dev-mac]
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare runner-local Python
        shell: bash
        run: |
          set -euo pipefail
          command -v python3
          python3 --version
          venv="$RUNNER_TEMP/mountains-data-weather-venv"
          rm -rf "$venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install --upgrade pip
          "$venv/bin/python" -m pip install -r requirements.txt
          echo "$venv/bin" >> "$GITHUB_PATH"

      - name: 날씨·대기질·특보 수집
        id: collect
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          set +e
          python pipeline/collect_weather.py
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          [ "$rc" = "0" ] || [ "$rc" = "3" ] || exit "$rc"

      - name: 변경분 커밋
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/v1/forecast data/v1/manifest.json
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git commit -m "forecast: $(date -u +%Y-%m-%dT%H:%MZ)"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: 중단된 회차는 빨간불로 남긴다
        if: steps.collect.outputs.rc == '3'
        run: |
          echo "포털 장애 또는 시간 초과로 이번 회차를 중간에 끊었습니다 — 받은 만큼은 커밋했습니다."
          echo "3시간 뒤 회차가 이어받습니다. 계속 빨간불이면 공공데이터포털 상태를 확인하세요."
          exit 1
