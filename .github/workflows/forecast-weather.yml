name: forecast-weather

# 3시간마다 산별 날씨·대기질·특보를 받아 forecast/<id>.json 으로 배포한다.
# 기상청 발표가 하루 8회(02·05·08·11·14·17·20·23시)라 그보다 자주 받을 이유가 없다.
# public 레포이므로 Actions 분은 무제한 — 가장 무거운 워크플로를 여기 두는 이유다.

on:
  schedule:
    - cron: "20 */3 * * *"
      timezone: "Asia/Seoul"
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/forecast-weather.yml

permissions:
  contents: write

concurrency:
  group: forecast-weather
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 날씨·대기질·특보 수집
        id: collect
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          set +e
          python pipeline/collect_weather.py
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          [ "$rc" = "0" ] || [ "$rc" = "3" ] || exit "$rc"

      - name: 변경분 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/v1/forecast data/v1/manifest.json
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "forecast: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - name: 중단된 회차는 빨간불로 남긴다
        if: steps.collect.outputs.rc == '3'
        run: |
          echo "포털 장애 또는 시간 초과로 이번 회차를 중간에 끊었습니다 — 받은 만큼은 커밋했습니다."
          echo "3시간 뒤 회차가 이어받습니다. 계속 빨간불이면 공공데이터포털 상태를 확인하세요."
          exit 1
