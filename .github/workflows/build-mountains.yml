name: build-mountains

# 산 마스터 재빌드. 원천이 거의 안 바뀌므로 월 1회면 충분하다.
# public repo에서 self-hosted runner를 쓰면 fork PR이 로컬 Mac에서 코드를 실행할 수 있어
# 보안상 이 워크플로는 GitHub-hosted runner를 유지한다.

on:
  schedule:
    - cron: "0 5 1 * *"
      timezone: "Asia/Seoul"
  workflow_dispatch:
    inputs:
      limit:
        description: "대상 산 수 (비우면 전체 300; 입력 시 검증용으로만 실행하고 커밋하지 않음)"
        required: false

permissions:
  contents: write

concurrency:
  group: build-mountains
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 산 마스터 빌드
        id: mountains
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          MOUNTAIN_LIMIT: ${{ inputs.limit }}
        run: |
          set -euo pipefail

          if [ -n "${MOUNTAIN_LIMIT:-}" ]; then
            python pipeline/build_mountains.py
            echo "fresh=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 일시적인 원천 API 장애에 최대 3회 재시도한다.
          # 실패 회차의 빈/부분 캐시는 매번 버린다.
          for attempt in 1 2 3; do
            echo "전체 빌드 시도 $attempt/3"
            rm -rf data/raw/api_cache
            set +e
            python pipeline/build_mountains.py
            rc=$?
            set -e
            count=$(python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/v1/mountains.json')
          try:
              print(len(json.loads(p.read_text()).get('mountains', [])) if p.exists() else 0)
          except Exception:
              print(0)
          PY
          )
            echo "시도 $attempt 결과: rc=$rc, 산 ${count}개"
            if [ "$rc" -eq 0 ] && [ "$count" -ge 300 ]; then
              echo "fresh=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            [ "$attempt" -eq 3 ] || sleep $((attempt * 20))
          done

          # 포털 장기 장애가 서비스 데이터까지 망가뜨리지 않도록 checkout 시점의
          # 마지막 검증된 300산을 복구하고 이번 갱신만 생략한다.
          git checkout HEAD -- data/v1/mountains.json data/v1/manifest.json
          echo "fresh=false" >> "$GITHUB_OUTPUT"
          echo "::warning::원천 API 장애로 신규 300산 빌드에 실패해 기존 검증 카탈로그를 유지합니다."
          echo "### build-mountains: 신규 빌드 생략" >> "$GITHUB_STEP_SUMMARY"
          echo "3회 재시도 후에도 원천 API가 응답하지 않아 기존 검증 300산을 유지합니다." >> "$GITHUB_STEP_SUMMARY"

      - name: 전체 빌드 개수 보호
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.limit == '' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('data/v1/mountains.json').read_text())
          count = len(data.get('mountains', []))
          print(f'현재 서비스 산 개수: {count}')
          if count < 300:
              raise SystemExit(f'산 카탈로그가 300개 미만({count})입니다. 배포를 중단합니다.')
          PY

      - name: 산 데이터 검증
        run: python pipeline/validate.py data/v1/mountains.json

      - name: 혼잡도 산별 파라미터 확장
        if: steps.mountains.outputs.fresh == 'true'
        run: python pipeline/build_crowd_params.py --refresh

      - name: 혼잡도 모델 검증
        run: python pipeline/validate.py data/v1/crowd_model.json

      - name: 변경분 커밋
        if: ${{ steps.mountains.outputs.fresh == 'true' && (github.event_name != 'workflow_dispatch' || inputs.limit == '') }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/v1/mountains.json data/v1/crowd_model.json data/v1/manifest.json
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "mountains: 마스터 재빌드"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          echo "동시 push 충돌이 3회 반복되어 중단합니다."
          exit 1
