name: build-mountains

# 산 마스터 재빌드. 원천이 거의 안 바뀌므로 월 1회면 충분하다.
# public repo에서 self-hosted runner를 쓰면 fork PR이 로컬 Mac에서 코드를 실행할 수 있어
# 보안상 이 워크플로는 GitHub-hosted runner를 유지한다.
#  · 산림청 산정보(3,368개) → 이름·표고·소재지·설명
#  · 전국등산로표준데이터(2,919건) → 코스·거리·소요시간·난이도
#  · 100대명산 목록/POI, 전국주요봉우리 POI → 봉우리 표고
#  · 국립공원 공원경계 → parkType 판정
#  · 국립공원 깃대종 → species
#  · 기상청 단기예보 격자 변환

on:
  schedule:
    - cron: "0 5 1 * *"
      timezone: "Asia/Seoul"
  workflow_dispatch:
    inputs:
      limit:
        description: "대상 산 수 (비우면 전체 300; 입력 시 검증용으로만 실행하고 커밋하지 않음)"
        required: false

permissions:
  contents: write

concurrency:
  group: build-mountains
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 산 마스터 빌드
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          MOUNTAIN_LIMIT: ${{ inputs.limit }}
        run: |
          set -euo pipefail

          # limit 지정은 빠른 검증용이므로 한 번만 실행한다.
          if [ -n "${MOUNTAIN_LIMIT:-}" ]; then
            python pipeline/build_mountains.py
            exit 0
          fi

          # 공공데이터포털의 일시적 ConnectTimeout 대응.
          # 실패 회차가 만든 빈 API 캐시는 다음 시도에서 재사용하지 않는다.
          for attempt in 1 2 3; do
            echo "전체 빌드 시도 $attempt/3"
            rm -rf data/raw/api_cache
            set +e
            python pipeline/build_mountains.py
            rc=$?
            set -e

            count=$(python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/v1/mountains.json')
          if not p.exists():
              print(0)
          else:
              try:
                  print(len(json.loads(p.read_text()).get('mountains', [])))
              except Exception:
                  print(0)
          PY
          )
            echo "시도 $attempt 결과: rc=$rc, 산 ${count}개"
            if [ "$rc" -eq 0 ] && [ "$count" -ge 300 ]; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done

          echo "3회 시도 후에도 300개 전체 빌드에 실패했습니다. 배포하지 않습니다."
          exit 1

      - name: 전체 빌드 개수 보호
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.limit == '' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('data/v1/mountains.json').read_text())
          count = len(data.get('mountains', []))
          print(f'전체 빌드 산 개수: {count}')
          if count < 300:
              raise SystemExit(f'전체 빌드가 300개 미만({count})입니다. 원천 API 장애 가능성이 있어 배포를 중단합니다.')
          PY

      - name: 검증
        run: python pipeline/validate.py data/v1/mountains.json

      - name: 혼잡도 산별 파라미터 확장
        run: python pipeline/build_crowd_params.py --refresh

      - name: 혼잡도 모델 검증
        run: python pipeline/validate.py data/v1/crowd_model.json

      - name: 변경분 커밋
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.limit == '' }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/v1/mountains.json data/v1/crowd_model.json data/v1/manifest.json
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "mountains: 마스터 재빌드"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          echo "동시 push 충돌이 3회 반복되어 중단합니다."
          exit 1
