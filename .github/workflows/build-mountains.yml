name: build-mountains

# 산 마스터 재빌드. 원천이 거의 안 바뀌므로 월 1회면 충분하다.
# 특별한 플랫폼 요구가 없으므로 공통 1402mac self-hosted runner에서 실행한다.
#  · 산림청 산정보(3,368개) → 이름·표고·소재지·설명
#  · 전국등산로표준데이터(2,919건) → 코스·거리·소요시간·난이도
#  · 100대명산 목록/POI, 전국주요봉우리 POI → 봉우리 표고
#  · 국립공원 공원경계 → parkType 판정
#  · 국립공원 깃대종 → species
#  · 기상청 단기예보 격자 변환
#    (산악예보는 포털에 없어 쓰지 않는다 — kmaMountainCode 는 계속 null)
#
# 마지막에 혼잡도 산별 파라미터를 마스터 전체로 넓힌다. 이걸 빼먹으면 새로 들어온 산이
# 앱에서 전부 같은 폴백 값(baseIndex 45)을 쓰게 되어 혼잡도 정렬이 무의미해진다.

on:
  schedule:
    - cron: "0 5 1 * *"
      timezone: "Asia/Seoul"
  workflow_dispatch:
    inputs:
      limit:
        description: "대상 산 수 (비우면 전체 300)"
        required: false

permissions:
  contents: write

concurrency:
  group: build-mountains
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, macOS, ARM64, dev-mac]
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare runner-local Python
        shell: bash
        run: |
          set -euo pipefail
          command -v python3
          python3 --version
          venv="$RUNNER_TEMP/mountains-data-build-venv"
          rm -rf "$venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install --upgrade pip
          "$venv/bin/python" -m pip install -r requirements.txt
          echo "$venv/bin" >> "$GITHUB_PATH"

      - name: 산 마스터 빌드
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          MOUNTAIN_LIMIT: ${{ inputs.limit }}
        run: python pipeline/build_mountains.py

      - name: 검증
        run: python pipeline/validate.py data/v1/mountains.json

      - name: 혼잡도 산별 파라미터 확장
        run: python pipeline/build_crowd_params.py --refresh

      - name: 혼잡도 모델 검증
        run: python pipeline/validate.py data/v1/crowd_model.json

      - name: 변경분 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/v1/mountains.json data/v1/crowd_model.json data/v1/manifest.json
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "mountains: 마스터 재빌드"
          git push
