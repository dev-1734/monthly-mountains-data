name: Probe data.go.kr key

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-data-key.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe encoded vs decoded service key
        shell: bash
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          python - <<'PY'
          import os, urllib.parse, requests
          url = 'https://apis.data.go.kr/1400000/service/cultureInfoService2/mntInfoOpenAPI2'
          raw = os.environ['DATA_GO_KR_KEY']
          variants = [('stored', raw), ('url_decoded', urllib.parse.unquote(raw))]
          for name, key in variants:
              try:
                  r = requests.get(url, params={'serviceKey': key, 'searchWrd':'', 'numOfRows':1, 'pageNo':1}, timeout=20)
                  body = r.text[:500].replace(raw, '***').replace(key, '***')
                  print(f'{name}: HTTP {r.status_code}; body={body!r}')
              except Exception as e:
                  print(f'{name}: ERROR {type(e).__name__}: {e}')
          PY
