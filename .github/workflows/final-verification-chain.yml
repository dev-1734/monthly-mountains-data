name: Final verification chain

on:
  workflow_run:
    workflows: ["build-mountains", "train-crowd"]
    types: [completed]

permissions:
  actions: write
  contents: write

jobs:
  after-build:
    if: ${{ github.event.workflow_run.name == 'build-mountains' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch train-crowd after build success
        run: gh workflow run train-crowd.yml --repo dev-1734/monthly-mountains-data

  after-train:
    if: ${{ github.event.workflow_run.name == 'train-crowd' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Retry forecast-weather after train success
        run: gh workflow run forecast-weather.yml --repo dev-1734/monthly-mountains-data
      - name: Remove one-time verification chain
        shell: bash
        run: |
          set -euo pipefail
          path='.github/workflows/final-verification-chain.yml'
          sha=$(gh api "repos/dev-1734/monthly-mountains-data/contents/$path" --jq .sha)
          gh api --method DELETE "repos/dev-1734/monthly-mountains-data/contents/$path" \
            -f message='ci: cleanup final verification chain' \
            -f sha="$sha" \
            -f branch=main >/dev/null
